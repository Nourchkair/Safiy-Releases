name: Feature request
description: Suggest an improvement to Sawti for Mac
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include recordings, transcripts, meeting screenshots, API keys, or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Sawti to do?
    validations:
      required: true
